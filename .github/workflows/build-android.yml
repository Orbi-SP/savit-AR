name: Build Android APK

# Gera o APK a cada push na main e cria uma GitHub Release quando uma versao nova e lancada.
# Uma versao e considerada nova quando:
#   - o "Version" do Player Settings (bundleVersion) muda para um valor que ainda nao tem tag (ex.: 0.0.2 -> tag v0.0.2), ou
#   - uma tag de versao (v1.2.3 / V1.2.3) e enviada manualmente.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and release decision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}' | tr -d '\r')

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#[vV]}"
            SHOULD_RELEASE=true
            if [[ "${VERSION}" != "${BUNDLE_VERSION}" ]]; then
              echo "::warning::Tag ${TAG} difere do bundleVersion (${BUNDLE_VERSION}). O APK sera gerado com a versao ${VERSION}."
            fi
          else
            VERSION="${BUNDLE_VERSION}"
            TAG="v${VERSION}"
            SHOULD_RELEASE=false
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              EXISTING=$(git ls-remote --tags origin "refs/tags/v${VERSION}" "refs/tags/V${VERSION}")
              if [[ -z "${EXISTING}" ]]; then
                SHOULD_RELEASE=true
              else
                echo "Versao ${VERSION} ja possui tag. Apenas o APK sera gerado (sem nova release)."
              fi
            fi
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versao '${VERSION}' invalida. Use o formato MAJOR.MINOR.PATCH (ex.: 0.0.2)."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Versao: ${VERSION} | Tag: ${TAG} | Criar release: ${SHOULD_RELEASE}"

  build-apk:
    name: Build Unity Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/Packages/manifest.json', '**/Packages/packages-lock.json') }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.2.6f2
          targetPlatform: Android
          buildName: savit
          androidAppBundle: false
          buildsPath: build
          versioning: Custom
          version: ${{ needs.version.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: savit-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [version, build-apk]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: savit-apk
          path: apk

      - name: Rename APK with version
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find apk -name '*.apk' | head -n 1)
          mv "${APK}" "savit-${{ needs.version.outputs.tag }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Savit ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: savit-${{ needs.version.outputs.tag }}.apk
          fail_on_unmatched_files: true
